<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 countdown</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

</head>
<body>
    <h1>2027</h1>
    <p>Conto alla rovescia</p>
    <div class="container">
        <div class="bx">
            <div id="day" class="counter"></div>
            <div class="caption">giorni</div>
        </div>
        <div class="bx">
            <div id="hour" class="counter"></div>
            <div class="caption">ore</div>
        </div>
        <div class="bx">
            <div id="minute" class="counter"></div>
            <div class="caption">minuti</div>
        </div>
        <div class="bx">
            <div id="second" class="counter"></div>
            <div class="caption">secondi</div>
        </div>
    </div>

    <script>
        var targetDate = new Date('Jan 1, 2027 00:00:00').getTime();

        function newYear(){
            var current = new Date().getTime();
            difference = targetDate - current;

            var second = 1000;
            var minute = second * 60;
            var hour = minute * 60;
            var day = hour * 24;

            var d = Math.floor(difference / (day));
            var h = Math.floor((difference % (day)) / (hour));
            var m = Math.floor((difference % (hour)) / (minute));
            var s = Math.floor((difference % (minute)) / (second));

            document.getElementById('day').innerText = d;
            document.getElementById('hour').innerText = h;
            document.getElementById('minute').innerText = m;
            document.getElementById('second').innerText = s;
        }

        newYear();
        setInterval(newYear, 1000);
    </script>
</body>
</html>
